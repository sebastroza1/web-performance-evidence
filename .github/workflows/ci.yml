name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile sources
        run: python -m compileall -q perf tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Reproduce evidence outputs
        run: python -m perf.cli --input fixtures/autismoconecta_local_p75.json --output examples/performance.md --chart examples/performance.svg
      - name: Verify committed evidence is reproducible
        run: git diff --exit-code -- examples
